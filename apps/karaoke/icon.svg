<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!-- HAS Karaoke app icon: the HEARASIDE mark (web/site/public/favicon.svg) on a dark tile, so it shows on light and dark taskbars -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2A2A28" />
      <stop offset="100%" stop-color="#151514" />
    </linearGradient>
    <linearGradient id="hs-silver" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#F0F0ED" />
      <stop offset="100%" stop-color="#D8D8D4" />
    </linearGradient>
    <linearGradient id="hs-diamond" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E2DE" />
    </linearGradient>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#tile)" />
  <rect x="17" y="17" width="478" height="478" rx="107" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="2" />
  <g transform="translate(256 256) scale(0.7) translate(-256 -256)">
    <path d="M 112 72 L 172 72 L 172 153.37 L 208 189.37 L 141.37 256 L 208 322.63 L 172 358.63 L 172 440 L 112 440 Z" fill="url(#hs-silver)" />
    <path d="M 400.00 72 L 340.00 72 L 340.00 153.37 L 304.00 189.37 L 370.63 256 L 304.00 322.63 L 340.00 358.63 L 340.00 440 L 400.00 440 Z" fill="url(#hs-silver)" />
    <path d="M 256 164 L 348 256 L 256 348 L 164 256 Z" fill="url(#hs-diamond)" />
  </g>
</svg>
