[package]
name = "hs-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
build = "build.rs"

[lints]
workspace = true

[features]
# PNG output of the headless renderer (hs-ui-gallery, ui-snapshot). A plug-in editor does not need it.
default = ["png"]
png = ["dep:png"]

[dependencies]
hs-app = { version = "0.1.0", path = "../hs-app" }
# R0.3 / PLAN D2: Slint with the software renderer only (no OpenGL, no windowing backend). Our own baseview adapter comes with R5.5.
slint = { version = "=1.18.1", default-features = false, features = ["std", "compat-1-2", "renderer-software", "software-renderer-systemfonts", "software-renderer-path"] }
qrcodegen = "=1.8.0"
png = { version = "=0.18.1", optional = true }

[build-dependencies]
slint-build = "=1.18.1"

[dev-dependencies]
serde_json = "=1.0.154"

[[bin]]
name = "hs-ui-gallery"
required-features = ["png"]
