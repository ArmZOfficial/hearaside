# Netlify root configuration
# ชี้ให้ Netlify build จากโฟลเดอร์ web/site โดยอัตโนมัติ
[build]
  base = "web/site"
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"
  # Deploy only from the production branch: main, feature branches and pull requests do not build.
  # Netlify skips a build when this command exits 0. Set Production branch = production in the Netlify UI.
  ignore = "[ \"$BRANCH\" != \"production\" ]"
