[package]
name = "hs-net"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
hs-bus = { version = "0.1.0", path = "../hs-bus" }
str0m = { version = "=0.24.1", default-features = false, features = ["aws-lc-rs"] }
if-addrs = "=0.15.0"
# share server: OS secure random for tokens, JSON control messages
getrandom = "=0.3.4"
serde_json = "=1.0.154"

# share server: poll / SO_SNDBUF on the sockets, MMCSS, the cloudflared job object
[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Networking_WinSock", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[target."cfg(unix)".dependencies]
libc = "0.2"

[build-dependencies]
cc = "1"
cmake = "0.1"
