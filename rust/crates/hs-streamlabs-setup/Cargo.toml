[package]
name = "hs-streamlabs-setup"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
name = "hs_streamlabs_setup"

# the installer runs "hearaside-streamlabs.exe" (installer/windows/hearaside.iss): the name is part of the contract
[[bin]]
name = "hearaside-streamlabs"
path = "src/main.rs"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp"] }
