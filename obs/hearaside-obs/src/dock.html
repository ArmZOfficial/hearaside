<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HEARASIDE</title>
<style>
:root{
  --paper:#F3F3F1;--grid:rgba(24,24,24,.05);--ink:#181818;--on-ink:#fff;--ink2:#3E3E3A;--graphite:#5A5A56;
  --off-fg:#55554F;--muted:#8A8A84;--glass:rgba(255,255,255,.66);--glass-edge:rgba(255,255,255,.85);
  --inset:rgba(240,240,237,.9);--off-bg:rgba(255,255,255,.8);--chip:rgba(255,255,255,.72);
  --h1:rgba(24,24,24,.05);--h2:rgba(24,24,24,.08);--h3:rgba(24,24,24,.12);--rail:rgba(24,24,24,.14);
  --sw-off:rgba(24,24,24,.18);--shadow:0 1px 2px rgba(24,24,24,.04),0 12px 32px rgba(24,24,24,.06);
  --blob1:rgba(112,106,96,.42);--blob2:rgba(40,40,38,.2);--thumb:#fff;
}
:root[data-theme=dark]{
  --paper:#151514;--grid:rgba(255,255,255,.045);--ink:#EDEDEA;--on-ink:#151514;--ink2:#CFCFCA;--graphite:#A3A39D;
  --off-fg:#ABABA4;--muted:#6E6E69;--glass:rgba(38,38,36,.66);--glass-edge:rgba(255,255,255,.1);
  --inset:rgba(255,255,255,.055);--off-bg:rgba(255,255,255,.05);--chip:rgba(255,255,255,.06);
  --h1:rgba(255,255,255,.06);--h2:rgba(255,255,255,.1);--h3:rgba(255,255,255,.16);--rail:rgba(255,255,255,.16);
  --sw-off:rgba(255,255,255,.2);--shadow:0 1px 2px rgba(0,0,0,.3),0 12px 32px rgba(0,0,0,.3);
  --blob1:rgba(150,138,118,.3);--blob2:rgba(90,90,86,.22);--thumb:#E9E9E5;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:Anuphan,"Noto Sans Thai","Leelawadee UI",Thonburi,"Segoe UI",sans-serif;color:var(--ink);font-size:13px;
  background-color:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:40px 40px;padding:12px;overflow-x:hidden;font-variant-numeric:tabular-nums}
body:before,body:after{content:"";position:fixed;border-radius:50%;pointer-events:none;z-index:-1;filter:blur(26px)}
body:before{left:-80px;top:-120px;width:420px;height:260px;background:radial-gradient(closest-side,var(--blob1),transparent)}
body:after{right:-120px;bottom:-80px;width:360px;height:360px;background:radial-gradient(closest-side,var(--blob2),transparent)}
.card{background:var(--glass);backdrop-filter:blur(18px) saturate(140%);border:1px solid var(--glass-edge);border-radius:20px;
  box-shadow:var(--shadow);padding:14px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:8px}
.between{justify-content:space-between}
.word{display:flex;flex-direction:column;line-height:1}
.word b{font-size:14px;font-weight:600;letter-spacing:.28em}
.word span{font-size:8px;font-weight:500;letter-spacing:.46em;color:var(--graphite);margin-top:3px}
.chip{display:flex;align-items:center;gap:7px;height:28px;padding:0 11px;border-radius:999px;background:var(--chip);
  border:1px solid var(--h2);font-size:11px;color:var(--ink2);white-space:nowrap}
.dot{width:6px;height:6px;border-radius:50%;background:var(--ink);box-shadow:0 0 0 3px var(--h3)}
.dot.ring{background:transparent;border:1.2px solid var(--ink)}
.iconbtn{width:28px;height:28px;border-radius:50%;border:1px solid var(--h2);background:var(--chip);color:var(--ink2);cursor:pointer;
  display:flex;align-items:center;justify-content:center;padding:0}
button{font-family:inherit;color:inherit}
button:focus-visible,input:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.big{width:100%;height:44px;border-radius:12px;border:1px solid var(--ink);display:flex;align-items:center;justify-content:center;
  gap:8px;font-size:14px;font-weight:600;cursor:pointer;background:var(--off-bg);color:var(--ink)}
.big.on{background:var(--ink);color:var(--on-ink)}
.big.primary{background:var(--ink);color:var(--on-ink)}
.big.primary.on{background:var(--off-bg);color:var(--ink)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.scenes{display:flex;flex-wrap:wrap;gap:4px;padding:4px;border-radius:18px;background:var(--h1);border:1px solid var(--h1)}
.scene{flex:1 1 auto;height:32px;padding:0 12px;border-radius:999px;border:0;background:transparent;color:var(--off-fg);font-size:13px;font-weight:500;cursor:pointer}
.scene.on{background:var(--thumb);color:#181818;box-shadow:0 1px 2px rgba(24,24,24,.08),0 4px 12px rgba(24,24,24,.06)}
h2{font-size:15px;font-weight:600;margin:0}
.cap{font-size:11px;color:var(--graphite)}
.lufs{display:flex;flex-direction:column;align-items:flex-end;padding:6px 10px;border-radius:12px;background:var(--inset);border:1px solid var(--h1)}
.lufs b{font-size:20px;font-weight:600;line-height:1.1}
.meter{flex:1;height:5px;border-radius:5px;background:var(--h2);overflow:hidden}
.meter i{display:block;height:100%;background:var(--ink);border-radius:5px;width:0;transition:width 60ms linear}
.lab{display:flex;justify-content:space-between;align-items:baseline;margin:10px 0 4px}
.val{font-size:12px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:4px;border-radius:4px;margin:8px 0;cursor:pointer;
  background:linear-gradient(90deg,var(--ink) var(--fill,50%),var(--rail) var(--fill,50%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--thumb);
  border:1px solid rgba(24,24,24,.2);box-shadow:0 1px 3px rgba(24,24,24,.2)}
input[type=range]:disabled{opacity:.35;cursor:not-allowed}
.switch{position:relative;width:44px;height:26px;border-radius:999px;border:0;background:var(--sw-off);cursor:pointer;padding:0;flex-shrink:0}
.switch:after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;
  box-shadow:0 1px 3px rgba(24,24,24,.25);transition:left .16s ease}
.switch.on{background:var(--ink)}.switch.on:after{left:21px}
:root[data-theme=dark] .switch.on:after{background:var(--on-ink)}
.track{border-radius:16px;background:var(--inset);border:1px solid var(--h1);padding:10px 12px;margin-top:8px}
.track.inactive{opacity:.5}
.tname{display:flex;align-items:center;gap:8px;min-width:0;flex:1}
.tname span.n{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tdot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.badge{font-size:10px;padding:2px 7px;border-radius:999px;background:var(--h2);color:var(--ink2);white-space:nowrap}
.pills{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.pill{height:38px;border-radius:12px;border:1px solid var(--h3);background:var(--off-bg);color:var(--off-fg);cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:6px;font-size:12.5px;font-weight:500}
.pill.on{background:var(--ink);border-color:var(--ink);color:var(--on-ink)}
.pill.pending{opacity:.6}
.lvl{display:grid;grid-template-columns:16px 1fr 52px;align-items:center;gap:6px;margin-top:2px}
.lvl .val{text-align:right;font-size:11.5px}
.lvl .val.off{color:var(--muted)}
svg{flex-shrink:0}
.more{display:none;margin-top:6px;padding-top:8px;border-top:1px solid var(--h2)}
.track.open .more{display:block}
.num{width:64px;height:28px;border-radius:8px;border:1px solid var(--h3);background:var(--off-bg);color:var(--ink);text-align:right;padding:0 8px;font:inherit}
.banner{border-radius:12px;padding:10px 12px;font-size:12.5px;line-height:1.5;margin-top:8px;display:flex;gap:8px;align-items:flex-start}
.banner.dark{background:var(--ink);color:var(--on-ink)}
.banner.outline{border:1px solid var(--ink);background:var(--off-bg)}
.banner.warn{border:1px solid var(--h3);background:var(--off-bg)}
.empty{font-size:13px;color:var(--graphite);line-height:1.6;padding:6px 2px}
.hide{display:none!important}
.foot{font-size:10.5px;color:var(--muted);text-align:center;margin:6px 0 2px}
</style>
</head>
<body>
<div class="card">
  <div class="row between">
    <div class="word"><b>HEARASIDE</b><span>OBS</span></div>
    <div class="row">
      <div class="chip hide" id="dawChip" title="DAW buffer"></div>
      <div class="chip" id="chip"><span class="dot" id="chipDot"></span><span id="chipText"></span></div>
      <button class="iconbtn" id="themeBtn" title="theme"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
      <button class="iconbtn" id="langBtn" title="language" style="font-size:10px;font-weight:600">TH</button>
    </div>
  </div>
  <div id="noHub" class="banner warn hide"></div>
  <div id="oldHub" class="banner warn hide"></div>
  <div id="main">
    <div class="grid2">
      <button class="big" id="panicBtn"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="m16 9 5 6"/><path d="m21 9-5 6"/></svg><span id="panicText"></span></button>
      <button class="big primary" id="previewBtn"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15v-3a8 8 0 0 1 16 0v3"/><rect x="3" y="14" width="4" height="6" rx="1.5"/><rect x="17" y="14" width="4" height="6" rx="1.5"/></svg><span id="previewText"></span></button>
    </div>
    <div id="bannerPreview" class="banner dark hide"></div>
    <div id="bannerPanic" class="banner outline hide"></div>
    <div style="margin-top:10px" class="scenes" id="scenes"></div>
  </div>
</div>

<div class="card" id="streamCard">
  <div class="row between" style="align-items:flex-start">
    <div><h2 id="tStream"></h2><div class="cap" id="tStreamSub"></div></div>
    <div class="lufs"><span class="cap" id="tLufs"></span><b id="lufs">–</b></div>
  </div>
  <div class="row" style="margin-top:10px"><span class="cap" style="width:10px">L</span><div class="meter"><i id="mL"></i></div></div>
  <div class="row" style="margin-top:5px"><span class="cap" style="width:10px">R</span><div class="meter"><i id="mR"></i></div></div>
  <div class="lab"><span id="tMaster"></span><span class="val" id="masterVal"></span></div>
  <input type="range" id="master" min="-30" max="6" step="0.5">
  <div class="row between" style="margin-top:6px">
    <div><div id="tLimiter"></div><div class="cap" id="tLimiterCap"></div></div>
    <button class="switch" id="limiter"></button>
  </div>
  <div class="lab"><span id="tPhones"></span><span class="val" id="phonesVal"></span></div>
  <input type="range" id="phones" min="-30" max="6" step="0.5">
  <div class="cap" id="tPhonesCap"></div>
</div>

<div class="card" id="tracksCard">
  <h2 id="tTracks"></h2>
  <div class="cap" id="tTracksSub"></div>
  <div id="tracks"></div>
  <div id="noTracks" class="empty hide"></div>
</div>
<div class="foot" id="foot"></div>

<script>
const TOKEN="%TOKEN%";
const params=new URLSearchParams(location.search);
const BUS=params.get('bus')||'Main';
const RP={Panic:1,Preview:2,MasterDb:3,LimiterOn:4,HeadphonesDb:5,RecallScene:6};
const TP={Mon:1,Str:2,Gain:3,Pan:4,Delay:5,Trim:6,Solo:7};
const S={
 th:{hubOk:'เชื่อมกับ Hub แล้ว',noHub:'ยังไม่มี Hub',noDaw:'ยังไม่เปิด DAW',
  noHubText:'ยังไม่พบ HEARASIDE Hub เปิดโปรเจกต์ DAW แล้วใส่ HEARASIDE Hub ที่ Master ก่อน หน้านี้จะเชื่อมเอง',
  oldHub:'Hub ที่เปิดอยู่เป็นรุ่นเก่า ยังรับคำสั่งจาก OBS ไม่ได้ ติดตั้ง HEARASIDE รุ่นล่าสุดแล้วเปิดโปรเจกต์ใหม่',
  muteOff:'ตัดเสียงคนดู',muteOn:'กดเพื่อคืนเสียง',prevOff:'ฟังแบบคนดู',prevOn:'กลับไปฟังแบบปกติ',
  bPrev:'คุณกำลังฟังแบบคนดู หูฟังจะได้ยินเหมือนเสียงที่ส่งไป OBS',bPanic:'ตัดเสียงไปหาคนดูอยู่ คนดูจะไม่ได้ยินอะไรจนกว่าคุณจะกดคืนเสียง',
  stream:'เสียงที่คนดูได้ยิน',streamSub:'ส่งเข้า OBS โดยตรง',lufs:'ความดัง (LUFS)',silent:'เงียบ',muted:'ตัดอยู่',
  master:'ระดับรวมไปหาคนดู',limiter:'กันเสียงพีค',limiterCap:'ไม่ให้เสียงแตกไปถึงคนดู',
  phones:'ระดับหูฟังรวม',phonesCap:'ลดเสียงที่คุณได้ยิน คนดูยังได้ยินเท่าเดิม',
  tracks:'แทร็กทั้งหมด',tracksSub:'แตะเพื่อสลับ ว่าแทร็กไหนคุณได้ยิน และแทร็กไหนคนดูได้ยิน',
  noTracks:'ยังไม่มีแทร็กที่ใส่ HEARASIDE Track ใส่ที่ท้าย FX ของแทร็กที่ต้องการ แล้วจะขึ้นที่นี่เอง',
  mon:'คุณได้ยิน',str:'คนดูได้ยิน',on:'ได้ยิน',off:'ไม่ได้ยิน',inactive:'ไม่ทำงาน',solo:'Solo ฝั่งคนดู',delay:'หน่วงเวลาฝั่งคนดู',
  rate:'Sample rate ไม่ตรงกับ Hub',ahead:'DAW ประมวลผลแทร็กนี้ล่วงหน้า',bypass:'ปลั๊กอินถูก bypass',latency:'เสียงถึง OBS ช้ากว่าจริง',more:'ตั้งค่าเพิ่ม'},
 en:{hubOk:'Connected to Hub',noHub:'No Hub yet',noDaw:'DAW not running',
  noHubText:'HEARASIDE Hub not found. Open your DAW project and put HEARASIDE Hub on the master bus; this panel connects by itself.',
  oldHub:'The running Hub is an older version that cannot take commands from OBS. Install the latest HEARASIDE and reopen the project.',
  muteOff:'Mute stream',muteOn:'Unmute stream',prevOff:"Hear viewers' mix",prevOn:'Back to my mix',
  bPrev:"You're hearing the viewers' mix. Your headphones get exactly what goes to OBS.",bPanic:'The stream is muted. Viewers hear nothing until you unmute.',
  stream:'What viewers hear',streamSub:'Sent straight to OBS',lufs:'Loudness (LUFS)',silent:'Silent',muted:'Muted',
  master:'Stream level',limiter:'Peak protection',limiterCap:'Keeps clipping away from viewers',
  phones:'Headphone master',phonesCap:'Turns down what you hear; viewers are not affected',
  tracks:'All tracks',tracksSub:'Tap to switch what you hear and what your viewers hear',
  noTracks:'No tracks yet. Put HEARASIDE Track last in a track\'s FX chain and it shows up here.',
  mon:'You hear',str:'Viewers hear',on:'On',off:'Off',inactive:'Inactive',solo:'Solo for viewers',delay:'Viewers delay',
  rate:'Sample rate differs from the Hub',ahead:'Processed ahead by the DAW',bypass:'Plug-in bypassed',latency:'Delay to OBS',more:'More'}
};
let lang=(localStorage.getItem('hrsd.lang')||'%LANG%').startsWith('en')?'en':'th';
let theme=localStorage.getItem('hrsd.theme')||'dark';
const T=k=>S[lang][k];
const $=id=>document.getElementById(id);
const ICON={mon:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15v-3a8 8 0 0 1 16 0v3"/><rect x="3" y="14" width="4" height="6" rx="1.5"/><rect x="17" y="14" width="4" height="6" rx="1.5"/></svg>',
 str:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="2"/><path d="M8.5 8.5a5 5 0 0 0 0 7"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M5.6 5.6a9 9 0 0 0 0 12.8"/><path d="M18.4 5.6a9 9 0 0 1 0 12.8"/></svg>',
 warn:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4"/><path d="M12 17h.01"/></svg>',
 more:'<svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><circle cx="5.5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="18.5" cy="12" r="1.4"/></svg>'};
const MINUS='−';
function fmtDb(db){if(db<=-30)return MINUS+'∞';const s=(db>0.04?'+':'')+Math.abs(db).toFixed(1);return(db<-0.04?MINUS:'')+s+' dB';}
function toSlider(db){return Math.max(-30,Math.min(6,db));}
function fromSlider(v){return v<=-30?-60:v;}
function fill(el){el.style.setProperty('--fill',((el.value-el.min)/(el.max-el.min)*100).toFixed(1)+'%');}
function meterPos(p){if(p<=1e-6)return 0;const db=20*Math.log10(p);return Math.max(0,Math.min(1,(db+60)/60));}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

function cmd(t,p,v){fetch(`/api/cmd?bus=${encodeURIComponent(BUS)}&token=${TOKEN}&t=${t}&p=${p}&v=${v}`,{method:'POST',cache:'no-store'}).catch(()=>{});}

// sliders: send while dragging (throttled), ignore incoming state for 600 ms after the user touched them
const touched={};
function bindSlider(el,key,send){
  let last=0,timer=null;
  const go=()=>{last=performance.now();timer=null;send(fromSlider(parseFloat(el.value)));};
  el.addEventListener('input',()=>{fill(el);touched[key]=performance.now();if(performance.now()-last>50)go();else if(!timer)timer=setTimeout(go,50);});
  el.addEventListener('change',()=>{touched[key]=performance.now();go();});
  el.addEventListener('dblclick',()=>{el.value=0;fill(el);touched[key]=performance.now();go();});
}
function setSlider(el,key,db){if(touched[key]&&performance.now()-touched[key]<600)return;const v=toSlider(db);if(Math.abs(el.value-v)>1e-3){el.value=v;}fill(el);}

let state=null;
bindSlider($('master'),'master',v=>cmd(-1,RP.MasterDb,v));
bindSlider($('phones'),'phones',v=>cmd(-1,RP.HeadphonesDb,v));
$('panicBtn').onclick=()=>state&&cmd(-1,RP.Panic,state.panic?0:1);
$('previewBtn').onclick=()=>state&&cmd(-1,RP.Preview,state.preview?0:1);
$('limiter').onclick=()=>state&&cmd(-1,RP.LimiterOn,state.limiter?0:1);
$('themeBtn').onclick=()=>{theme=theme==='dark'?'light':'dark';localStorage.setItem('hrsd.theme',theme);applyTheme();};
$('langBtn').onclick=()=>{lang=lang==='th'?'en':'th';localStorage.setItem('hrsd.lang',lang);texts();rows={};$('tracks').innerHTML='';render();};
function applyTheme(){document.documentElement.dataset.theme=theme;}

function texts(){
  document.documentElement.lang=lang;$('langBtn').textContent=lang==='th'?'TH':'EN';
  for(const[k,id]of[['stream','tStream'],['streamSub','tStreamSub'],['lufs','tLufs'],['master','tMaster'],['limiter','tLimiter'],
    ['limiterCap','tLimiterCap'],['phones','tPhones'],['phonesCap','tPhonesCap'],['tracks','tTracks'],['tracksSub','tTracksSub'],
    ['noTracks','noTracks'],['noHubText','noHub'],['oldHub','oldHub'],['bPrev','bannerPreview'],['bPanic','bannerPanic']])$(id).textContent=T(k);
}

let rows={};
function trackRow(t){
  const el=document.createElement('div');el.className='track';
  el.innerHTML=`<div class="row between"><div class="tname"><span class="tdot"></span><span class="n"></span><span class="badge hide"></span><span class="w hide" style="display:flex"></span></div>
   <button class="iconbtn mo" title="${esc(T('more'))}">${ICON.more}</button></div>
   <div class="pills"><button class="pill pm">${ICON.mon}<span></span></button><button class="pill ps">${ICON.str}<span></span></button></div>
   <div class="lvl"><span class="li">${ICON.mon}</span><input type="range" class="rm" min="-30" max="6" step="0.5"><span class="val vm"></span></div>
   <div class="lvl"><span class="li">${ICON.str}</span><input type="range" class="rs" min="-30" max="6" step="0.5"><span class="val vs"></span></div>
   <div class="more"><div class="row between" style="margin-top:4px"><span>${esc(T('delay'))}</span><span class="row"><input class="num nd" type="number" min="0" max="500" step="1"><span class="cap">ms</span></span></div>
   <div class="row between" style="margin-top:8px"><span>${esc(T('solo'))}</span><button class="switch so"></button></div></div>`;
  const q=s=>el.querySelector(s);
  const r={el,slot:t.slot,dot:q('.tdot'),name:q('.n'),badge:q('.badge'),warn:q('.w'),pm:q('.pm'),ps:q('.ps'),rm:q('.rm'),rs:q('.rs'),vm:q('.vm'),vs:q('.vs'),nd:q('.nd'),so:q('.so'),t};
  r.warn.innerHTML=ICON.warn;
  q('.mo').onclick=()=>el.classList.toggle('open');
  r.pm.onclick=()=>{r.pm.classList.add('pending');cmd(r.slot,TP.Mon,r.t.mon?0:1);};
  r.ps.onclick=()=>{r.ps.classList.add('pending');cmd(r.slot,TP.Str,r.t.str?0:1);};
  r.so.onclick=()=>cmd(r.slot,TP.Solo,r.t.solo?0:1);
  bindSlider(r.rm,'m'+t.slot,v=>{cmd(r.slot,TP.Trim,v);r.vm.textContent=fmtDb(Math.max(-30,v));});
  bindSlider(r.rs,'s'+t.slot,v=>{cmd(r.slot,TP.Gain,v);r.vs.textContent=fmtDb(Math.max(-30,v));});
  r.nd.addEventListener('change',()=>{const v=Math.max(0,Math.min(500,parseFloat(r.nd.value)||0));touched['d'+r.slot]=performance.now();cmd(r.slot,TP.Delay,v);});
  return r;
}
function updateRow(r,t,i){
  r.t=t;
  const shades=['var(--ink)','#5A5A56','#8C8C86','#B4B4AE','#D2D2CC'];
  r.dot.style.background=t.color||shades[i%5];
  r.name.textContent=t.name;
  r.el.classList.toggle('inactive',!t.active);
  r.badge.classList.toggle('hide',t.active&&!t.solo);r.badge.textContent=!t.active?T('inactive'):'Solo';
  r.warn.classList.toggle('hide',!t.warn);r.warn.title=t.warn?T(t.warn):'';
  for(const[b,on,k]of[[r.pm,t.mon,'mon'],[r.ps,t.str,'str']]){b.classList.toggle('on',on);b.classList.remove('pending');
    b.querySelector('span').textContent=on?T('on'):T('off');b.setAttribute('aria-pressed',on);b.title=T(k)+' '+t.name;}
  setSlider(r.rm,'m'+t.slot,t.trim);setSlider(r.rs,'s'+t.slot,t.gain);
  r.rm.disabled=!t.mon;r.rs.disabled=!t.str;
  if(!(touched['m'+t.slot]&&performance.now()-touched['m'+t.slot]<600))r.vm.textContent=fmtDb(toSlider(t.trim));
  if(!(touched['s'+t.slot]&&performance.now()-touched['s'+t.slot]<600))r.vs.textContent=fmtDb(toSlider(t.gain));
  r.vm.classList.toggle('off',!t.mon);r.vs.classList.toggle('off',!t.str);
  if(document.activeElement!==r.nd&&!(touched['d'+t.slot]&&performance.now()-touched['d'+t.slot]<800))r.nd.value=Math.round(t.delay);
  r.so.classList.toggle('on',t.solo);
}

function render(){
  const ok=state&&state.ok, hub=ok&&state.hub;
  $('chipText').textContent=!ok?T('noDaw'):hub?T('hubOk'):T('noHub');
  $('chipDot').className='dot'+(hub?'':' hide');
  $('noHub').classList.toggle('hide',!!hub);
  $('oldHub').classList.toggle('hide',!(hub&&!state.remote));
  for(const id of['main','streamCard','tracksCard'])$(id).classList.toggle('hide',!hub);
  if(!hub){$('dawChip').classList.add('hide');$('foot').textContent='bus: '+BUS;return;}
  $('dawChip').classList.toggle('hide',!(state.dawBlock>0));
  $('dawChip').textContent=`DAW ${state.dawBlock} · ${state.dawMs.toFixed(1)} ms`;
  $('panicBtn').classList.toggle('on',state.panic);$('panicText').textContent=state.panic?T('muteOn'):T('muteOff');
  $('previewBtn').classList.toggle('on',state.preview);$('previewText').textContent=state.preview?T('prevOn'):T('prevOff');
  $('bannerPreview').classList.toggle('hide',!state.preview);$('bannerPanic').classList.toggle('hide',!state.panic);
  $('lufs').textContent=state.panic?T('muted'):state.lufs<-70?T('silent'):state.lufs.toFixed(1).replace('-',MINUS);
  $('mL').style.width=(meterPos(state.peakL)*100).toFixed(1)+'%';$('mR').style.width=(meterPos(state.peakR)*100).toFixed(1)+'%';
  setSlider($('master'),'master',state.master);setSlider($('phones'),'phones',state.headphones);
  if(!(touched.master&&performance.now()-touched.master<600))$('masterVal').textContent=fmtDb(toSlider(state.master));
  else $('masterVal').textContent=fmtDb(parseFloat($('master').value));
  if(!(touched.phones&&performance.now()-touched.phones<600))$('phonesVal').textContent=fmtDb(toSlider(state.headphones));
  else $('phonesVal').textContent=fmtDb(parseFloat($('phones').value));
  $('limiter').classList.toggle('on',state.limiter);
  // scenes
  const sc=$('scenes');let html='';
  state.scenes.forEach((n,i)=>{if(state.sceneMask&(1<<i))html+=`<button class="scene${state.scene===i?' on':''}" data-i="${i}">${esc(n)}</button>`;});
  if(sc.dataset.h!==html){sc.innerHTML=html;sc.dataset.h=html;sc.querySelectorAll('button').forEach(b=>b.onclick=()=>cmd(-1,RP.RecallScene,b.dataset.i));}
  // tracks (keyed by slot so sliders keep focus while dragging)
  const list=$('tracks');const seen={};
  state.tracks.forEach((t,i)=>{let r=rows[t.slot];if(!r){r=rows[t.slot]=trackRow(t);}updateRow(r,t,i);seen[t.slot]=1;
    if(list.children[i]!==r.el)list.insertBefore(r.el,list.children[i]||null);});
  for(const k in rows)if(!seen[k]){rows[k].el.remove();delete rows[k];}
  $('noTracks').classList.toggle('hide',state.tracks.length>0);
  $('foot').textContent=`${T('latency')} ${state.latencyMs} ms = DAW ${state.dawMs.toFixed(1)} (${state.dawBlock} sm) + Hub ${state.hubMs.toFixed(1)} + OBS ${state.obsMs.toFixed(0)} · ${(state.rate/1000).toFixed(1)} kHz · bus ${BUS}`;
}

async function poll(){
  try{const r=await fetch(`/api/state?bus=${encodeURIComponent(BUS)}&token=${TOKEN}`,{cache:'no-store'});state=await r.json();}
  catch(e){state=null;}
  render();setTimeout(poll,document.hidden?1000:125);
}
applyTheme();texts();poll();
</script>
</body>
</html>
