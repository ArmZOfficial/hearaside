[workspace]
members = ["crates/hs-bus", "crates/hs-dsp", "crates/hs-engine", "crates/hs-ffi", "crates/hs-app", "crates/hs-net", "crates/hs-tools", "crates/hs-testkit", "crates/hs-obs", "crates/hs-streamlabs-setup", "crates/hs-ui"]
exclude = ["spikes"]   # R0.3 / R0.4 throwaway spikes, each its own workspace
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
publish = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)'] }

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"

[profile.release]
panic = "unwind"

# hs-ui's tests render whole pages (backdrop pixels, Slint's software renderer); unoptimised that takes minutes
[profile.dev.package.hs-ui]
opt-level = 3
[profile.dev.package.i-slint-core]
opt-level = 3
[profile.dev.package.i-slint-renderer-software]
opt-level = 3
