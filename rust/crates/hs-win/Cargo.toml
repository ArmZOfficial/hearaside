[package]
name = "hs-win"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

# registry + COM only on Windows; the sample conversions and the device logic compile (and are tested) everywhere
[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Registry", "Win32_UI_Input_KeyboardAndMouse"] }
