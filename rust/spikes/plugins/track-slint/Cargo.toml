[package]
name = "spike-track-slint"
version = "0.0.1"
edition = "2024"
license = "MIT"
publish = false

# R0.3 spike: the Track page as an empty VST3/CLAP plug-in (DAW criteria). Not part of the product.
#   cargo xtask bundle spike-track-slint --release
# Its own workspace: Slint and Vizia link different Skia versions.
[workspace]
members = [".", "xtask"]

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
nice-plug = "=0.1.8"
slint-baseview = "=0.1.0"
slint = { version = "=1.16.1", default-features = false, features = ["std", "renderer-femtovg", "raw-window-handle-06", "compat-1-2"] }

[build-dependencies]
slint-build = "=1.16.1"
