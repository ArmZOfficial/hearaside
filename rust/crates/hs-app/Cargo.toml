[package]
name = "hs-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
ureq = { version = "=3.5.0", default-features = false, features = ["rustls-no-provider", "platform-verifier", "win-system-proxy"] }
rustls = { version = "=0.23.46", default-features = false, features = ["aws-lc-rs", "std", "tls12"] }
serde_json = "=1.0.154"
roxmltree = "=0.21.2"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Cryptography", "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_System_Time", "Win32_UI_Shell"] }

[target."cfg(unix)".dependencies]
libc = "0.2"
