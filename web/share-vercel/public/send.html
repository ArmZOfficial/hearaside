<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F3F3F1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151514" media="(prefers-color-scheme: dark)">
<title>HEARASIDE Send</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #F3F3F1; --ink: #181818; --on-ink: #FFFFFF; --ink2: #3E3E3A; --graphite: #5A5A56; --muted: #8A8A84;
  --glass: rgba(255,255,255,0.62); --glass-edge: rgba(255,255,255,0.85); --inset: rgba(240,240,237,0.90);
  --hair: rgba(24,24,24,0.08); --hair3: rgba(24,24,24,0.12); --rail: rgba(24,24,24,0.14); --switch-off: rgba(24,24,24,0.18);
  --shadow: rgba(24,24,24,0.08); --warm: rgba(112,106,96,0.42); --cool: rgba(40,40,38,0.20); --grid: rgba(24,24,24,0.05);
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #151514; --ink: #EDEDEA; --on-ink: #151514; --ink2: #CFCFCA; --graphite: #A3A39D; --muted: #6E6E69;
    --glass: rgba(38,38,36,0.62); --glass-edge: rgba(255,255,255,0.10); --inset: rgba(255,255,255,0.055);
    --hair: rgba(255,255,255,0.10); --hair3: rgba(255,255,255,0.16); --rail: rgba(255,255,255,0.16); --switch-off: rgba(255,255,255,0.20);
    --shadow: rgba(0,0,0,0.35); --warm: rgba(150,138,118,0.30); --cool: rgba(90,90,86,0.22); --grid: rgba(255,255,255,0.045);
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; min-height: 100%; }
body {
  font-family: "Anuphan", system-ui, -apple-system, "Segoe UI", sans-serif;
  background: var(--paper); color: var(--ink);
  min-height: 100dvh; display: grid; place-items: center; padding: 24px 16px; overflow-x: hidden;
}
.backdrop { position: fixed; inset: 0; z-index: -1; overflow: hidden;
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 32px 32px; }
.blob { position: absolute; border-radius: 50%; filter: blur(70px); }
.blob.warm { width: 60vmax; height: 60vmax; background: var(--warm); top: -22vmax; left: -18vmax; }
.blob.cool { width: 50vmax; height: 50vmax; background: var(--cool); bottom: -20vmax; right: -16vmax; }
.card {
  width: min(440px, 100%); background: var(--glass); border: 1px solid var(--glass-edge); border-radius: 28px;
  backdrop-filter: blur(28px) saturate(1.2); -webkit-backdrop-filter: blur(28px) saturate(1.2);
  box-shadow: 0 24px 60px var(--shadow); padding: 28px 24px 22px;
}
.top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.lang { border: 1px solid var(--hair3); background: transparent; color: var(--ink2); font: inherit; font-size: 12px; font-weight: 500;
  border-radius: 999px; padding: 5px 11px; cursor: pointer; }
.brand { letter-spacing: .42em; font-weight: 600; font-size: 15px; }
.brand small { display: block; letter-spacing: .5em; font-weight: 500; font-size: 10px; color: var(--graphite); margin-top: 2px; }
h1 { font-size: 26px; font-weight: 600; margin: 22px 0 4px; overflow-wrap: anywhere; }
.sub { color: var(--graphite); font-size: 14px; margin: 0; line-height: 1.5; }
.stage { display: grid; place-items: center; padding: 30px 0 18px; }
.mic {
  position: relative; width: 112px; height: 112px; border-radius: 50%; border: 0; cursor: pointer;
  background: var(--ink); color: var(--on-ink); display: grid; place-items: center;
  box-shadow: 0 14px 34px var(--shadow); transition: transform .15s ease;
}
.mic:active { transform: scale(.96); }
.mic svg { width: 40px; height: 40px; }
.level { position: absolute; inset: -12px; border-radius: 50%; border: 3px solid var(--ink); opacity: 0; transform: scale(.9); transition: transform .06s linear, opacity .06s linear; }
.muted .mic { background: var(--switch-off); color: var(--ink); }
.hint { margin-top: 16px; font-size: 14px; color: var(--graphite); min-height: 20px; text-align: center; }
.chip { display: inline-flex; align-items: center; gap: 8px; padding: 7px 14px; border-radius: 999px;
  background: var(--inset); border: 1px solid var(--hair); font-size: 13px; color: var(--ink2); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.live .dot { background: var(--ink); box-shadow: 0 0 0 4px var(--hair3); }
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.value { font-size: 12px; color: var(--graphite); font-variant-numeric: tabular-nums; text-align: right; }
.panel { margin-top: 16px; padding: 14px 16px; border-radius: 18px; background: var(--inset); border: 1px solid var(--hair); display: grid; gap: 14px; }
.label { font-size: 13px; }
.cap { font-size: 11px; color: var(--graphite); margin-top: 2px; line-height: 1.45; }
select { width: 100%; font: inherit; font-size: 13px; color: var(--ink); background: var(--paper); border: 1px solid var(--hair3);
  border-radius: 12px; padding: 9px 12px; }
.switch { position: relative; width: 46px; height: 28px; flex: none; }
.switch input { opacity: 0; width: 0; height: 0; position: absolute; }
.switch span { position: absolute; inset: 0; border-radius: 14px; background: var(--switch-off); transition: background .2s; cursor: pointer; }
.switch span::after { content: ""; position: absolute; top: 4px; left: 4px; width: 20px; height: 20px; border-radius: 50%; background: #fff;
  box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .2s; }
.switch input:checked + span { background: var(--ink); }
.switch input:checked + span::after { transform: translateX(18px); }
.switch input:focus-visible + span { box-shadow: 0 0 0 3px var(--hair3); }
input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 22px; background: transparent; margin: 6px 0 0; }
input[type=range]::-webkit-slider-runnable-track { height: 4px; border-radius: 2px; background: linear-gradient(var(--ink), var(--ink)) 0/var(--fill, 80%) 100% no-repeat, var(--rail); }
input[type=range]::-moz-range-track { height: 4px; border-radius: 2px; background: var(--rail); }
input[type=range]::-moz-range-progress { height: 4px; border-radius: 2px; background: var(--ink); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%; margin-top: -7px;
  background: #fff; border: 1px solid var(--hair3); box-shadow: 0 2px 6px var(--shadow); }
input[type=range]::-moz-range-thumb { width: 18px; height: 18px; border-radius: 50%; background: #fff; border: 1px solid var(--hair3); }
.mute { border: 1px solid var(--hair3); background: var(--paper); color: var(--ink); font: inherit; font-size: 14px; font-weight: 500;
  border-radius: 14px; padding: 12px; cursor: pointer; width: 100%; margin-top: 14px; }
.btn-secondary {
  border: 1px solid var(--hair3); background: var(--paper); color: var(--ink); font: inherit; font-size: 12px; font-weight: 500;
  border-radius: 10px; padding: 6px 12px; cursor: pointer; transition: transform .1s, background .15s; flex: none;
}
.btn-secondary:active { transform: scale(.96); }
.banner {
  margin-top: 14px; padding: 12px 14px; border-radius: 14px; border: 1px solid var(--hair3);
  background: var(--inset); font-size: 13px; line-height: 1.45; display: flex; flex-direction: column; gap: 8px;
}
.banner.alert { border-color: rgba(220, 60, 60, 0.4); background: rgba(220, 60, 60, 0.08); }
.checklist {
  margin-top: 18px; padding: 14px 16px; border-radius: 18px; background: var(--inset); border: 1px solid var(--hair);
  display: flex; flex-direction: column; gap: 10px;
}
.check-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.check-title { font-size: 13.5px; font-weight: 600; color: var(--ink); }
.check-item { display: flex; align-items: center; gap: 12px; }
.check-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); flex: none; transition: background .2s, box-shadow .2s; }
.check-dot.ok { background: #22C55E; box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.22); }
.check-dot.warn { background: #EAB308; box-shadow: 0 0 0 3px rgba(234, 179, 8, 0.22); }
.check-info { flex: 1; min-width: 0; }
.check-name { font-size: 13px; font-weight: 500; color: var(--ink); }
.check-status { font-size: 11.5px; color: var(--graphite); margin-top: 1px; line-height: 1.35; }
.ready-badge {
  padding: 4px 10px; border-radius: 999px; background: rgba(34, 197, 94, 0.15);
  border: 1px solid rgba(34, 197, 94, 0.35); color: #15803D; font-size: 12px; font-weight: 600;
  display: inline-flex; align-items: center; gap: 5px; animation: popIn .2s ease-out;
}
@media (prefers-color-scheme: dark) {
  .ready-badge { background: rgba(34, 197, 94, 0.2); border-color: rgba(34, 197, 94, 0.45); color: #4ADE80; }
}
@keyframes popIn { from { opacity: 0; transform: scale(0.94); } to { opacity: 1; transform: scale(1); } }
details.troubleshoot {
  margin-top: 14px; padding: 12px 16px; border-radius: 16px; background: var(--inset); border: 1px solid var(--hair);
  font-size: 13px; color: var(--ink2); cursor: pointer;
}
details.troubleshoot summary {
  font-weight: 500; color: var(--ink); cursor: pointer; list-style: none; display: flex; align-items: center; justify-content: space-between;
}
details.troubleshoot summary::-webkit-details-marker { display: none; }
details.troubleshoot summary::after { content: "+"; font-size: 16px; color: var(--graphite); font-weight: 400; }
details.troubleshoot[open] summary::after { content: "\2212"; }
.troubleshoot-content { margin-top: 12px; display: flex; flex-direction: column; gap: 10px; font-size: 12px; line-height: 1.5; color: var(--graphite); cursor: default; }
.troubleshoot-row strong { color: var(--ink); display: block; margin-bottom: 2px; }
.warn { display: none; margin-top: 16px; padding: 12px 14px; border-radius: 14px; border: 1px solid var(--hair3); font-size: 13px; line-height: 1.5; }
.insecure .warn { display: block; }
.tip { margin-top: 14px; font-size: 12px; color: var(--graphite); line-height: 1.5; text-align: center; }
.transport-badge {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 3px 9px; border-radius: 999px; font-size: 11px; font-weight: 600;
  letter-spacing: .02em; border: 1px solid transparent; transition: all .2s ease;
}
.transport-badge.direct {
  background: rgba(34, 197, 94, 0.15); border-color: rgba(34, 197, 94, 0.35); color: #15803D;
}
.transport-badge.relay {
  background: rgba(234, 179, 8, 0.15); border-color: rgba(234, 179, 8, 0.35); color: #B45309;
}
.transport-badge.opus {
  background: rgba(6, 182, 212, 0.15); border-color: rgba(6, 182, 212, 0.35); color: #0E7490;
}
.transport-badge.pcm {
  background: rgba(148, 163, 184, 0.15); border-color: rgba(148, 163, 184, 0.35); color: #475569;
}
@media (prefers-color-scheme: dark) {
  .transport-badge.direct {
    background: rgba(34, 197, 94, 0.22); border-color: rgba(34, 197, 94, 0.45); color: #4ADE80;
  }
  .transport-badge.relay {
    background: rgba(234, 179, 8, 0.22); border-color: rgba(234, 179, 8, 0.45); color: #FCD34D;
  }
  .transport-badge.opus {
    background: rgba(6, 182, 212, 0.22); border-color: rgba(6, 182, 212, 0.45); color: #67E8F9;
  }
  .transport-badge.pcm {
    background: rgba(148, 163, 184, 0.22); border-color: rgba(148, 163, 184, 0.45); color: #CBD5E1;
  }
}
.foot { margin-top: 10px; text-align: center; font-size: 11px; color: var(--muted); }
</style>
</head>
<body>
<div class="backdrop"><div class="blob warm"></div><div class="blob cool"></div></div>
<main class="card" id="app">
  <div class="top"><div class="brand">HEARASIDE<small>SEND</small></div><button class="lang" id="lang"></button></div>
  <h1 id="title"></h1>
  <p class="sub" id="subtitle"></p>

  <div class="stage">
    <button class="mic" id="mic" aria-label="Microphone">
      <span class="level" id="level"></span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3"/>
      </svg>
    </button>
    <div class="hint" id="hint"></div>
  </div>

  <div class="row"><span class="chip"><span class="dot"></span><span id="status"></span></span><span class="transport-badge" id="transportBadge" style="display:none"></span><span class="value" id="delay"></span></div>
  <button class="mute" id="mute" hidden></button>

  <div class="checklist" id="preflight">
    <div class="check-head">
      <div class="check-title" data-t="preflightTitle"></div>
      <div class="ready-badge" id="readyBadge" style="display:none" data-t="readyToSing"></div>
    </div>
    <div class="check-item" id="chkMic">
      <div class="check-dot" id="dotMic"></div>
      <div class="check-info">
        <div class="check-name" data-t="chkMicName"></div>
        <div class="check-status" id="chkMicStatus" data-t="chkMicWait"></div>
      </div>
    </div>
    <div class="check-item" id="chkHp">
      <div class="check-dot" id="dotHp"></div>
      <div class="check-info">
        <div class="check-name" data-t="chkHpName"></div>
        <div class="check-status" id="chkHpStatus" data-t="chkHpWait"></div>
      </div>
    </div>
    <div class="check-item" id="chkNet">
      <div class="check-dot" id="dotNet"></div>
      <div class="check-info">
        <div class="check-name" data-t="chkNetName"></div>
        <div class="check-status" id="chkNetStatus" data-t="chkNetWait"></div>
      </div>
    </div>
  </div>

  <div class="panel">
    <div>
      <div class="label" data-t="device"></div>
      <select id="device" style="margin-top:8px"></select>
    </div>
    <div class="row" style="align-items: center">
      <div><div class="label" data-t="hpCheck"></div><div class="cap" id="hpResult" data-t="hpCheckCap"></div></div>
      <button class="btn-secondary" id="hpBtn" type="button" data-t="hpCheckBtn"></button>
    </div>
    <div class="row">
      <div><div class="label" data-t="speaker"></div><div class="cap" data-t="speakerCap"></div></div>
      <label class="switch"><input type="checkbox" id="speaker"><span></span></label>
    </div>
    <div class="row">
      <div><div class="label" data-t="clean"></div><div class="cap" data-t="cleanCap"></div></div>
      <label class="switch"><input type="checkbox" id="clean"><span></span></label>
    </div>
    <div class="row">
      <div><div class="label" data-t="stereo"></div><div class="cap" data-t="stereoCap"></div></div>
      <label class="switch"><input type="checkbox" id="stereo"><span></span></label>
    </div>
    <div class="row">
      <div><div class="label" data-t="hearMyself"></div><div class="cap" data-t="hearMyselfCap"></div></div>
      <label class="switch"><input type="checkbox" id="hearMyself"><span></span></label>
    </div>
    <div id="hearPanel">
      <div class="row">
        <div><div class="label" data-t="hear"></div><div class="cap" data-t="hearCap"></div></div>
        <label class="switch"><input type="checkbox" id="hear" checked><span></span></label>
      </div>
      <input type="range" id="vol" min="0" max="100" value="80" aria-label="Volume">
    </div>
  </div>
  <div id="hpBanner" class="banner alert" style="display:none">
    <div id="hpBannerText"></div>
    <button class="btn-secondary" id="enableSpeakerBtn" type="button" data-t="enableSpeaker"></button>
  </div>
  <details class="troubleshoot">
    <summary data-t="echoHelpTitle"></summary>
    <div class="troubleshoot-content">
      <div class="troubleshoot-row">
        <strong data-t="echoDirectTitle"></strong>
        <span data-t="echoDirectDesc"></span>
      </div>
      <div class="troubleshoot-row">
        <strong data-t="echoHubTitle"></strong>
        <span data-t="echoHubDesc"></span>
      </div>
      <div class="troubleshoot-row">
        <strong data-t="echoSpeakerTitle"></strong>
        <span data-t="echoSpeakerDesc"></span>
      </div>
    </div>
  </details>
  <div class="warn" data-t="insecure"></div>
  <div class="tip" data-t="tip"></div>
  <div class="foot" id="foot"></div>
</main>

<script>
const T = {
  th: { title: "ส่งเสียงเข้า DAW", invited: "{host} ชวนคุณมาร้องเพลง", you: "คุณคือ {name}",
        subtitle: "เสียงไมค์ของคุณจะเข้าไปในแทร็กของคนที่ส่งลิงก์นี้ให้ แบบสด ๆ",
        subtitleRoom: "ได้ยินเพลงของเจ้าของลิงก์ ร้องตามได้เลย เสียงคุณจะถูกจัดให้ตรงจังหวะเอง",
        preflightTitle: "เช็กก่อนร้อง",
        chkMicName: "ไมค์", chkMicWait: "แตะไมค์เพื่อทดสอบสัญญาณ", chkMicOk: "ไมค์ทำงานปกติ ✓",
        chkHpName: "หูฟัง", chkHpWait: "แนะนำให้ใส่หูฟังเพื่อไม่ให้เสียงเพลงสะท้อน", chkHpOk: "ใช้หูฟังอยู่ (ไม่มีเสียงรั่ว) ✓",
        chkHpSpeaker: "โหมดลำโพง (เปิดตัดเสียงสะท้อนแล้ว)",
        chkNetName: "สัญญาณเน็ต", chkNetWait: "รอเชื่อมต่อห้อง...", chkNetOk: "เชื่อมต่อแล้ว (RTT {rtt} ms) ✓",
        chkNetConnecting: "กำลังเชื่อมต่อ...", readyToSing: "พร้อมร้อง ✓",
        echoHelpTitle: "ได้ยินเสียงตัวเองซ้อน?",
        echoDirectTitle: "ได้ยินเสียงตัวเองทันที (Direct Monitor):",
        echoDirectDesc: "ดูที่ Audio Interface ของคุณว่าเปิดปุ่ม Direct Monitor หรือหมุน Mix/Playback อยู่ไหม ให้ปรับเป็น Playback 100% หรือปิด Direct Monitor",
        echoHubTitle: "ได้ยินเสียงตัวเองหน่วงตามเน็ต:",
        echoHubDesc: "ปิดสวิตช์ \"ได้ยินตัวเองจาก Hub\" ด้านล่าง (ค่าเริ่มต้นปิดอยู่แล้ว)",
        echoSpeakerTitle: "เสียงเพลงจากลำโพงย้อนเข้าไมค์:",
        echoSpeakerDesc: "แนะนำให้ใส่หูฟัง หรือเปิดสวิตช์ \"โหมดลำโพง (ตัดเสียงสะท้อน AEC)\" ด้านล่าง",
        device: "ไมค์ที่ใช้", clean: "ตัดเสียงรบกวน", cleanCap: "เปิดถ้าอยู่ในที่เสียงดัง (คุยมากกว่าร้องเพลง)",
        hpCheck: "ตรวจการใช้หูฟัง", hpCheckCap: "เล่นเสียงสั้น ๆ เช็กว่าเสียงลำโพงเข้าไมค์ไหม", hpCheckBtn: "เช็กหูฟัง",
        hpChecking: "กำลังเช็กเสียง chirp...", hpOk: "ใช้หูฟังอยู่ พร้อมร้อง ✓",
        hpLeak: "ดูเหมือนใช้ลำโพง (เสียงเพลงอาจสะท้อนกลับ)",
        speaker: "โหมดลำโพง (ตัดเสียงสะท้อน)", speakerCap: "เปิดการตัดเสียงสะท้อน (AEC) เมื่อไม่ได้ใส่หูฟัง",
        enableSpeaker: "เปิดโหมดลำโพง (AEC)",
        stereo: "สเตอริโอ (เครื่องดนตรี)", stereoCap: "ปิด = โมโน ใช้เน็ตน้อยลงครึ่งหนึ่ง เปิดเมื่อส่งคีย์บอร์ดหรือกีตาร์ที่มี 2 ช่อง",
        hearMyself: "ได้ยินตัวเองจาก Hub", hearMyselfCap: "ได้ยินเสียงตัวเองส่งกลับมาจาก Hub (จะหน่วงเท่ากับความช้าเน็ต)",
        hear: "ฟังเพลง", hearCap: "ได้ยินเพลงที่เจ้าของลิงก์เล่นอยู่ ใช้หูฟังเพื่อไม่ให้เสียงเพลงเข้าไมค์",

  } catch (e) {
    stop();
    status(L.denied);
    return;
  }
  $("mute").hidden = false;
  connect();
  meter();
}

let encoder = null, decoder = null, useOpus = false, upSeq = 0, echoQueue = [], downPosQueue = [];

async function setupOpus(chans) {
  if (typeof AudioEncoder === "undefined" || typeof AudioDecoder === "undefined") return false;
  try {
    const encSupport = await AudioEncoder.isConfigSupported({
      codec: "opus",
      sampleRate: 48000,
      numberOfChannels: chans,
      bitrate: chans === 2 ? 128000 : 64000
    });
    const decSupport = await AudioDecoder.isConfigSupported({
      codec: "opus",
      sampleRate: 48000,
      numberOfChannels: 2
    });
    if (!encSupport.supported || !decSupport.supported) return false;

    if (encoder) { try { encoder.close(); } catch (e) {} encoder = null; }
    if (decoder) { try { decoder.close(); } catch (e) {} decoder = null; }
    echoQueue = [];
    downPosQueue = [];

    decoder = new AudioDecoder({
      output: audioData => {
        const n = audioData.numberOfFrames, ch = audioData.numberOfChannels;
        const fl = new Float32Array(n), fr = new Float32Array(n);
        if (audioData.format && audioData.format.includes("planar")) {
          audioData.copyTo(fl, { planeIndex: 0 });
          if (ch > 1) audioData.copyTo(fr, { planeIndex: 1 });
          else fr.set(fl);
        } else {
          const interleaved = new Float32Array(n * ch);
          audioData.copyTo(interleaved, { planeIndex: 0 });
          if (ch > 1) {
            for (let i = 0; i < n; i++) { fl[i] = interleaved[i * 2]; fr[i] = interleaved[i * 2 + 1]; }
          } else {
            fl.set(interleaved); fr.set(interleaved);
          }
        }
        const pos = downPosQueue.length > 0 ? downPosQueue.shift() : undefined;
        if (node) node.port.postMessage({ rate: audioData.sampleRate, fl, fr, pos }, [fl.buffer, fr.buffer]);
        audioData.close();
      },
      error: e => { console.warn("AudioDecoder error:", e); downPosQueue.length = 0; }
    });
    decoder.configure({ codec: "opus", sampleRate: 48000, numberOfChannels: 2 });

    encoder = new AudioEncoder({
      output: chunk => {
        const echo = echoQueue.length > 0 ? echoQueue.shift() : 0;
        const payload = new Uint8Array(chunk.byteLength);
        chunk.copyTo(payload);
        const hdr = 22;
        const buf = new ArrayBuffer(hdr + payload.length);
        const v = new DataView(buf);
        v.setUint32(0, 0x33415248, true);   // "HRA3"
        v.setUint8(4, 1);                   // CodecOpus
        v.setUint8(5, chans);               // chans (1 or 2)
        v.setUint16(6, 1, true);            // FlagFec
        v.setUint32(8, upSeq++, true);      // seq
        v.setBigUint64(12, BigInt(Math.max(0, Math.round(echo || 0))), true); // pos / echo
        v.setUint16(20, 480, true);         // frames per packet
        new Uint8Array(buf, hdr).set(payload);
        if (rtcActive && rtcDc && rtcDc.readyState === "open" && rtcDc.bufferedAmount < 40000) {
          rtcDc.send(buf);
        } else if (ws && ws.readyState === 1 && ws.bufferedAmount <= 40000) {
          ws.send(buf);
        }
      },
      error: e => console.warn("AudioEncoder error:", e)
    });
    encoder.configure({
      codec: "opus",
      sampleRate: 48000,
      numberOfChannels: chans,
      bitrate: chans === 2 ? 128000 : 64000,
      opus: {
        application: "voip",
        frameDuration: 10000,
        packetlossperc: 5,
        useinbandfec: true
      }
    });
    useOpus = true;
    updateTransportBadge();
    return true;
  } catch (e) {
    useOpus = false;
    updateTransportBadge();
    return false;
  }
}

let pc = null, rtcDc = null, rtcActive = false, rtcCandidateType = "", rtcFailTimer = null, rtcStatsTimer = null;

function updateTransportBadge() {
  const badge = $("transportBadge");
  if (!badge) return;
  if (!running || !ws || ws.readyState !== 1) {
    badge.style.display = "none";
    return;
  }
  badge.style.display = "inline-flex";
  badge.className = "transport-badge";
  if (rtcActive && rtcCandidateType === "relay") {
    badge.classList.add("relay");
    badge.textContent = L.transportRelay;
  } else if (rtcActive) {
    badge.classList.add("direct");
    badge.textContent = L.transportDirect;
  } else if (useOpus) {
    badge.classList.add("opus");
    badge.textContent = L.transportOpus;
  } else {
    badge.classList.add("pcm");
    badge.textContent = L.transportPcm;
  }
}

async function fetchTurnConfig() {
  try {
    const res = await fetch("/api/turn");
    if (res.ok) {
      const data = await res.json();
      if (data && Array.isArray(data.iceServers) && data.iceServers.length > 0) {
        return data.iceServers;
      }
    }
  } catch (e) {}
  return null;
}

async function inspectCandidatePair() {
  if (!pc || !pc.getStats) return;
  try {
    const stats = await pc.getStats();
    stats.forEach(report => {
      if (report.type === "candidate-pair" && report.state === "succeeded") {
        const localCand = stats.get(report.localCandidateId);
        const remoteCand = stats.get(report.remoteCandidateId);
        if ((localCand && localCand.candidateType === "relay") ||
            (remoteCand && remoteCand.candidateType === "relay")) {
          rtcCandidateType = "relay";
        } else {
          rtcCandidateType = "direct";
        }
      }
    });
    updateTransportBadge();
  } catch (e) {}
}

function cleanupRtc() {
  clearTimeout(rtcFailTimer);
  clearInterval(rtcStatsTimer);
  rtcActive = false;
  rtcCandidateType = "";
  if (rtcDc) {
    try { rtcDc.close(); } catch (e) {}
    rtcDc = null;
  }
  if (pc) {
    try { pc.close(); } catch (e) {}
    pc = null;
  }
  updateTransportBadge();
}

async function initRtc(offerSdp) {
  cleanupRtc();
  let iceServers = [
    { urls: "stun:stun.cloudflare.com:3478" },
    { urls: "stun:stun.l.google.com:19302" }
  ];
  const turnServers = await fetchTurnConfig();
  if (turnServers && turnServers.length > 0) iceServers = turnServers;
  pc = new RTCPeerConnection({ iceServers });

  pc.ondatachannel = e => {
    rtcDc = e.channel;
    setupDataChannel(rtcDc);
  };

  pc.onicecandidate = e => {
    if (e.candidate && ws && ws.readyState === 1) {
      ws.send(JSON.stringify({
        type: "rtc_candidate",
        candidate: e.candidate.candidate,
        mid: e.candidate.sdpMid
      }));
    }
  };

  pc.onconnectionstatechange = () => {
    if (pc && (pc.connectionState === "failed" || pc.connectionState === "disconnected")) {
      cleanupRtc();
    }
    updateTransportBadge();
  };

  rtcFailTimer = setTimeout(() => {
    if (!rtcActive) updateTransportBadge();
  }, 3000);

  try {
    await pc.setRemoteDescription({ type: "offer", sdp: offerSdp });
    const answer = await pc.createAnswer();
    await pc.setLocalDescription(answer);
    if (ws && ws.readyState === 1) {
      ws.send(JSON.stringify({ type: "rtc_answer", sdp: answer.sdp }));
    }
  } catch (err) {
    console.warn("RTC setup error:", err);
    cleanupRtc();
  }
}

function setupDataChannel(channel) {
  channel.binaryType = "arraybuffer";
  channel.onopen = () => {
    clearTimeout(rtcFailTimer);
    rtcActive = true;
    inspectCandidatePair();
    rtcStatsTimer = setInterval(inspectCandidatePair, 2000);
    updateTransportBadge();
  };
  channel.onclose = () => {
    rtcActive = false;
    updateTransportBadge();
  };
  channel.onerror = () => {
    rtcActive = false;
    updateTransportBadge();
  };
  channel.onmessage = e => {
    if (e.data instanceof ArrayBuffer) handleAudioData(e.data);
  };
}

function handleAudioData(buf) {
  const d = new DataView(buf);
  const magic = d.getUint32(0, true);
  if (magic === 0x33415248) {   // "HRA3"
    if (!node) return;
    const codec = d.getUint8(4);
    if (codec === 1 && decoder && decoder.state === "configured") {
      const pos = Number(d.getBigUint64(12, true));
      const payload = new Uint8Array(buf, 22);
      try {
        downPosQueue.push(pos);
        decoder.decode(new EncodedAudioChunk({ type: "key", timestamp: 0, data: payload }));
      } catch (err) {
        downPosQueue.pop();
      }
    }
    return;
  }
  if (magic !== 0x32415248 || !node) return;   // "HRA2": the Stream Mix with a position
  const rate = d.getUint32(4, true), frames = d.getUint32(12, true);
  if (!frames) return;
  const pos = Number(d.getBigUint64(16, true));
  const pcm = new Int16Array(buf.slice(24));
  node.port.postMessage({ rate, pcm, pos }, [pcm.buffer]);
}

async function connect() {
  const mine = ++gen;
  const url = await locate("s");
  if (mine !== gen || !running) return;
  if (!url) { status(L.offline); later(connect); return; }
  duplex = false;
  useOpus = false;
  ws = new WebSocket(url);
  ws.binaryType = "arraybuffer";
  ws.onopen = () => {
    backoff = 2000;
    status(muted ? L.muted : L.live, !muted);
    updateTransportBadge();
    ws.send(JSON.stringify({
      speakerMode: $("speaker").checked,
      hearMyself: $("hearMyself").checked
    }));
    // a Hub that knows friends says hello first; an older Hub says nothing: then only the microphone goes out
    clearTimeout(legacyTimer);
    legacyTimer = setTimeout(() => { if (!duplex && room) { room = null; applyLang(); } }, 1500);
  };
  ws.onmessage = e => {
    if (typeof e.data === "string") {
      let m = null;
      try { m = JSON.parse(e.data); } catch (x) {}
      if (!m) return;
      if (m.type === "rtc_offer" && m.sdp) {
        initRtc(m.sdp);
        return;
      }
      if (m.type === "rtc_candidate" && pc && m.candidate) {
        pc.addIceCandidate({ candidate: m.candidate, sdpMid: m.mid || "0" }).catch(() => {});
        return;
      }
      if (m.v >= 2) {
        duplex = true;
        room = { name: m.name || "", host: m.host || "" };
        applyLang();
        if (m.codecs && m.codecs.includes("opus")) {
          const ch = $("stereo").checked ? 2 : 1;
          setupOpus(ch).then(ok => {
            if (ok && ws && ws.readyState === 1) {
              ws.send(JSON.stringify({ codec: "opus" }));
            }
          });
        }
      }
      if (m.delay !== undefined) { behindMs = m.delay >= 0 ? m.delay : null; showBehind(); }
      if (m.ping !== undefined) ws.send(JSON.stringify({ pong: m.ping }));   // the Hub measures the round trip (an older Hub never asks)
      return;
    }
    handleAudioData(e.data);
  };
  ws.onclose = () => { if (!running) return; cleanupRtc(); clearTimeout(legacyTimer); behindMs = null; echoQueue.length = 0; downPosQueue.length = 0; showBehind(); status(L.lost); later(connect, 5000); };   // locate() again: the tunnel may have moved
}

function send(f, echo, chans) {
  if (useOpus && encoder && encoder.state === "configured") {
    try {
      const data = muted ? new Float32Array(f.length) : f;
      const audioData = new AudioData({
        format: "f32",
        sampleRate: 48000,
        numberOfFrames: 480,
        numberOfChannels: chans,
        timestamp: upSeq * 10000,
        data: data
      });
      echoQueue.push(echo);
      encoder.encode(audioData);
      audioData.close();
      return;
    } catch (e) {}
  }
  const v2 = duplex, hdr = v2 ? 24 : 16, n = f.length / chans;
  const buf = new ArrayBuffer(hdr + f.length * 2), d = new DataView(buf), s = new Int16Array(buf, hdr);
  d.setUint32(0, v2 ? 0x32415248 : 0x31415248, true); d.setUint32(4, ctx.sampleRate, true); d.setUint16(8, chans, true);
  d.setUint16(10, latencyKnown ? 1 : 0, true); d.setUint32(12, n, true);
  if (v2) d.setBigUint64(16, BigInt(Math.max(0, Math.round(echo || 0))), true);
  for (let i = 0; i < f.length; i++) s[i] = muted ? 0 : Math.max(-32768, Math.min(32767, Math.round(f[i] * 32767)));
  if (rtcActive && rtcDc && rtcDc.readyState === "open" && rtcDc.bufferedAmount < 40000) {
    rtcDc.send(buf);
  } else if (ws && ws.readyState === 1 && ws.bufferedAmount <= 40000) {
    ws.send(buf);
  }
}

function meter() {
  if (!running) return;
  if (peak > 0.015 && !micHeard) {
    micHeard = true;
    updatePreflight();
  }
  const lv = muted ? 0 : Math.max(0, Math.min(1, (20 * Math.log10(Math.max(peak, 1e-6)) + 50) / 50));
  $("level").style.opacity = (0.15 + lv * 0.6).toFixed(2);
  $("level").style.transform = "scale(" + (0.92 + lv * 0.28).toFixed(3) + ")";
  if (ctx) $("foot").textContent = (ctx.sampleRate / 1000).toFixed(1) + " kHz · " + (useOpus ? "Opus" : "16-bit");
  updateTransportBadge();
  requestAnimationFrame(meter);
}

function stop() {
  running = false;
  cleanupRtc();
  micHeard = false;
  netRtt = null;
  clearTimeout(retry);
  clearTimeout(legacyTimer);
  gen++;
  backoff = 2000;
  useOpus = false;
  echoQueue = [];
  if (encoder) { try { encoder.close(); } catch (e) {} encoder = null; }
  if (decoder) { try { decoder.close(); } catch (e) {} decoder = null; }
  if (ws) { ws.onclose = null; ws.close(); ws = null; }
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  if (ctx) { ctx.close(); ctx = null; node = null; outGain = null; }
  releaseAudio();
  behindMs = null;
  $("level").style.opacity = 0;
  idle();
  updatePreflight();
}

$("mic").onclick = () => running ? stop() : start();
$("mute").onclick = () => {
  muted = !muted;
  app.classList.toggle("muted", muted);
  $("mute").textContent = muted ? L.unmute : L.mute;
  if (ws && ws.readyState === 1) status(muted ? L.muted : L.live, !muted);
};
$("mute").textContent = L.mute;
$("device").onchange = () => { if (running) openMic(); };
$("clean").onchange = () => { if (running) openMic(); };
$("stereo").onchange = () => {
  try { localStorage.setItem("hearaside-stereo", $("stereo").checked ? "1" : "0"); } catch (e) {}
  if (running) openMic();
};
try { $("stereo").checked = localStorage.getItem("hearaside-stereo") === "1"; } catch (e) {}

$("speaker").onchange = () => {
  try { localStorage.setItem("hearaside-speaker", $("speaker").checked ? "1" : "0"); } catch (e) {}
  updatePreflight();
  if (running) openMic();
  else if (ws && ws.readyState === 1) ws.send(JSON.stringify({ speakerMode: $("speaker").checked }));
};
try { $("speaker").checked = localStorage.getItem("hearaside-speaker") === "1"; } catch (e) {}

$("hearMyself").onchange = () => {
  try { localStorage.setItem("hearaside-hearmyself", $("hearMyself").checked ? "1" : "0"); } catch (e) {}
  if (ws && ws.readyState === 1) ws.send(JSON.stringify({ hearMyself: $("hearMyself").checked }));
};
try { $("hearMyself").checked = localStorage.getItem("hearaside-hearmyself") === "1"; } catch (e) {}

let checkingHp = false;
async function checkHeadphones() {
  if (checkingHp) return;
  checkingHp = true;
  $("hpBtn").disabled = true;
  $("hpResult").textContent = L.hpChecking;
  $("hpBanner").style.display = "none";

  let createdLocalCtx = false;
  let testCtx = ctx;
  if (!testCtx || testCtx.state === "closed") {
    testCtx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 48000 });
    createdLocalCtx = true;
  }
  if (testCtx.state === "suspended") await testCtx.resume().catch(() => {});

  let testStream = stream;
  let createdLocalStream = false;
  if (!testStream) {
    try {
      testStream = await navigator.mediaDevices.getUserMedia({ audio: {
        deviceId: $("device").value ? { exact: $("device").value } : undefined,
        echoCancellation: false, noiseSuppression: false, autoGainControl: false, channelCount: 1
      }});
      createdLocalStream = true;
    } catch (e) {
      checkingHp = false;
      $("hpBtn").disabled = false;
      $("hpResult").textContent = L.denied;
      if (createdLocalCtx) testCtx.close().catch(() => {});
      return;
    }
  }

  const analyser = testCtx.createAnalyser();
  analyser.fftSize = 512;
  const micSrc = testCtx.createMediaStreamSource(testStream);
  micSrc.connect(analyser);

  const timeData = new Float32Array(analyser.fftSize);
  function getRms() {
    analyser.getFloatTimeDomainData(timeData);
    let sum = 0;
    for (let i = 0; i < timeData.length; ++i) sum += timeData[i] * timeData[i];
    return Math.sqrt(sum / timeData.length);
  }

  let baseRms = 0;
  for (let i = 0; i < 4; ++i) {
    baseRms = Math.max(baseRms, getRms());
    await new Promise(r => setTimeout(r, 50));
  }

  const osc = testCtx.createOscillator();
  const g = testCtx.createGain();
  const now = testCtx.currentTime;
  osc.type = "sine";
  osc.frequency.setValueAtTime(400, now);
  osc.frequency.exponentialRampToValueAtTime(2000, now + 0.6);

  g.gain.setValueAtTime(0.001, now);
  g.gain.linearRampToValueAtTime(0.2, now + 0.05);
  g.gain.setValueAtTime(0.2, now + 0.55);
  g.gain.linearRampToValueAtTime(0.0001, now + 0.6);

  osc.connect(g).connect(testCtx.destination);
  osc.start(now);
  osc.stop(now + 0.6);

  let chirpPeakRms = 0;
  const startMs = Date.now();
  while (Date.now() - startMs < 650) {
    chirpPeakRms = Math.max(chirpPeakRms, getRms());
    await new Promise(r => setTimeout(r, 30));
  }

  micSrc.disconnect();
  if (createdLocalStream) testStream.getTracks().forEach(t => t.stop());
  if (createdLocalCtx) testCtx.close().catch(() => {});

  const leaked = (chirpPeakRms > 0.025 && chirpPeakRms > baseRms * 2.5);
  checkingHp = false;
  $("hpBtn").disabled = false;

  if (leaked) {
    hpState = "leak";
    $("hpResult").textContent = L.hpLeak;
    $("hpBannerText").textContent = L.hpLeak;
    $("hpBanner").style.display = "flex";
  } else {
    hpState = "ok";
    $("hpResult").textContent = L.hpOk;
    $("hpBanner").style.display = "none";
  }
  updatePreflight();
}

$("hpBtn").onclick = checkHeadphones;
$("enableSpeakerBtn").onclick = () => {
  $("speaker").checked = true;
  try { localStorage.setItem("hearaside-speaker", "1"); } catch (e) {}
  $("hpBanner").style.display = "none";
  updatePreflight();
  if (running) openMic();
  else if (ws && ws.readyState === 1) ws.send(JSON.stringify({ speakerMode: true }));
};

$("hear").onchange = setVolume;
$("vol").oninput = setVolume;
setVolume();
if (navigator.mediaDevices) listDevices().catch(() => {});
</script>
